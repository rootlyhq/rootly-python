[project]
name = "rootly"
version = "3.0.0"
description = "A client library for accessing Rootly API v1"
authors = []
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["dependencies"]

[dependency-groups]
dev = ["openapi-python-client==0.29.0; python_version >= '3.11'", "ruff==0.16.3"]

[project.urls]
Homepage = "https://github.com/rootlyhq/rootly-python"
Issues = "https://github.com/rootlyhq/rootly-python/issues"
Repository = "https://github.com/rootlyhq/rootly-python.git"
Changelog = "https://github.com/rootlyhq/rootly-python/releases"

[tool.poetry]
packages = [
    { include = "rootly_sdk" },
]
include = ["CHANGELOG.md", "rootly_sdk/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
